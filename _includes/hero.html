<header class="hero-band">
  <div class="hero-inner">
    <img class="hero-photo" src="{{ site.logo | relative_url }}" alt="Photo of {{ site.author.name }}" width="1996" height="1385">
    <div class="hero-text">
      <p class="hero-kicker">{{ site.hero.kicker }}</p>
      <h1>{{ site.hero.title }}</h1>
      <p class="hero-lead">{{ site.hero.lead }}</p>
      <p class="btn-row">
        {% for b in site.hero.buttons %}
          <a class="btn{% if forloop.first %} primary{% endif %}" href="{{ b.url | relative_url }}"{% if b.url contains '://' %} target="_blank" rel="noopener"{% endif %}>{{ b.title }}</a>
        {% endfor %}
      </p>
      <p class="hero-meta">{{ site.description }} &middot; <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a></p>
    </div>
  </div>
</header>
