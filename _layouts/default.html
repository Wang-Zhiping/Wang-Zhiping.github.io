<!DOCTYPE html>
<html lang="{{ site.lang | default: "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1419" media="(prefers-color-scheme: dark)">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.github.build_revision | default: site.time | date: '%s' }}">
    {% include head-custom.html %}
  </head>
  <body{% if page.url == "/" %} class="is-home"{% endif %}>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="wrapper">
      {% include sidebar.html %}

      <main id="main" class="content">
        {{ content }}
      </main>

      <footer class="site-footer">
        <p>
          &copy; {{ site.time | date: "%Y" }} {{ site.author.name }} &middot;
          Last updated {{ site.time | date: "%B %Y" }} &middot;
          Built with <a href="https://jekyllrb.com/">Jekyll</a> on <a href="https://pages.github.com/">GitHub Pages</a>
          <a href="https://clustrmaps.com/site/1bx3g" title="Visit tracker"><img src="//www.clustrmaps.com/map_v2.png?d=l8Vxf3g7cK6-tuIQUBBtPNSo7ALplEXpHsJAAcgXi20&amp;cl=ffffff" width="1" height="1" alt=""></a>
        </p>
      </footer>
    </div>
  </body>
</html>
